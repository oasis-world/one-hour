<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0e1014" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One Hour" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1125x2436.png" />
    <title>一小时 · one hour</title>
    <style>
      /* Inline splash: paints with the document itself — no white flash,
         no waiting for the JS bundle or any stylesheet. The app removes
         it once the shell has mounted (src/main.tsx). */
      html,
      body {
        background: #0e1014;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 90% at 20% 10%, #23283a 0%, transparent 55%),
          radial-gradient(120% 100% at 85% 90%, #3a2a24 0%, transparent 60%),
          #0e1014;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .splash-mark {
        color: #e8b04b;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash-word {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #f3efe7;
        opacity: 0.85;
      }
      .splash-word span {
        color: #e8b04b;
        margin: 0 2px;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 1;
          transform: none;
        }
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <svg
          class="splash-mark"
          width="44"
          height="44"
          viewBox="0 0 14 14"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <rect width="14" height="14" rx="3" fill="#e85d3a" />
          <rect x="4" y="3" width="6" height="2" rx="0.5" fill="#ffffff" />
          <rect x="6" y="3" width="2" height="8" fill="#ffffff" />
          <rect x="4" y="9" width="6" height="2" rx="0.5" fill="#ffffff" />
        </svg>
        <div class="splash-word">一小时 <span>·</span> one hour</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
